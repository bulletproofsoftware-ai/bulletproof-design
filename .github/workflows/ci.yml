name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run generate:tokens
      - run: npm run generate:registry

      # Quality checks
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Integration tests require the running Next.js (8095) + Express (8096) stack.
      # They are not run in basic CI; run them locally with the stack up: npm test

      # Build
      - name: Build
        run: npm run build
