components:
  # ─── UI tier ───
  - name: Badge
    tier: ui
    description: Inline status indicator with variant styles
    examples:
      - label: Default badge
        code: '<Badge>New</Badge>'
    accessibility:
      role: status
      notes: Uses semantic span element

  - name: Button
    tier: ui
    description: Primary interactive control with multiple variants and sizes
    examples:
      - label: Default button
        code: '<Button>Click me</Button>'
      - label: Destructive button
        code: '<Button variant="destructive">Delete</Button>'
    accessibility:
      role: button
      keyboard: [ Enter, Space ]
      notes: Supports asChild for custom element rendering via Radix Slot

  - name: Card
    tier: ui
    description: Container component for grouping related content
    examples:
      - label: Basic card
        code: '<Card><CardHeader><CardTitle>Title</CardTitle></CardHeader><CardContent>Content</CardContent></Card>'
    accessibility:
      notes: Semantic grouping via data-slot attributes

  - name: Command
    tier: ui
    description: Command palette built on cmdk for searchable actions
    examples:
      - label: Command dialog
        code: '<CommandDialog><CommandInput placeholder="Search..."
          /><CommandList><CommandEmpty>No
          results</CommandEmpty></CommandList></CommandDialog>'
    accessibility:
      role: combobox
      keyboard: [ ArrowUp, ArrowDown, Enter, Escape ]
      notes: Full keyboard navigation via cmdk primitives

  - name: Dialog
    tier: ui
    description: Modal dialog overlay using Radix Dialog primitives
    examples:
      - label: Basic dialog
        code: '<Dialog><DialogTrigger>Open</DialogTrigger><DialogContent><DialogTitle>Title</DialogTitle></DialogContent></Dialog>'
    accessibility:
      role: dialog
      keyboard: [ Escape, Tab ]
      notes: Focus trap and screen reader announcements via Radix

  - name: DropdownMenu
    tier: ui
    description: Contextual action menu using Radix DropdownMenu primitives
    examples:
      - label: Basic menu
        code: '<DropdownMenu><DropdownMenuTrigger>Open</DropdownMenuTrigger><DropdownMenuContent><DropdownMenuItem>Action</DropdownMenuItem></DropdownMenuContent></DropdownMenu>'
    accessibility:
      role: menu
      keyboard: [ ArrowUp, ArrowDown, Enter, Escape ]
      notes: Full keyboard navigation via Radix

  - name: Input
    tier: ui
    description: Text input field with consistent styling and validation states
    examples:
      - label: Default input
        code: '<Input placeholder="Enter text..." />'
    accessibility:
      role: textbox
      notes: Supports aria-invalid for error states

  - name: ScrollArea
    tier: ui
    description: Custom scrollable area using Radix ScrollArea
    examples:
      - label: Scrollable container
        code: '<ScrollArea className="h-48"><div>Long content...</div></ScrollArea>'
    accessibility:
      notes: Provides custom scrollbar without hiding native scroll behavior from
        assistive tech

  - name: Select
    tier: ui
    description: Dropdown select component using Radix Select primitives
    examples:
      - label: Basic select
        code: '<Select><SelectTrigger><SelectValue placeholder="Choose..."
          /></SelectTrigger><SelectContent><SelectItem value="a">Option
          A</SelectItem></SelectContent></Select>'
    accessibility:
      role: listbox
      keyboard: [ ArrowUp, ArrowDown, Enter, Escape, Space ]
      notes: Full keyboard navigation via Radix

  - name: Separator
    tier: ui
    description: Visual divider using Radix Separator
    examples:
      - label: Horizontal separator
        code: '<Separator />'
    accessibility:
      role: separator
      notes: Sets appropriate role and orientation automatically

  - name: Sheet
    tier: ui
    description: Slide-out panel using Radix Dialog primitives
    examples:
      - label: Right sheet
        code: '<Sheet><SheetTrigger>Open</SheetTrigger><SheetContent>Panel
          content</SheetContent></Sheet>'
    accessibility:
      role: dialog
      keyboard: [ Escape, Tab ]
      notes: Focus trap and screen reader announcements

  - name: Tabs
    tier: ui
    description: Tab navigation component using Radix Tabs with CVA variants
    examples:
      - label: Basic tabs
        code: '<Tabs defaultValue="a"><TabsList><TabsTrigger value="a">Tab
          A</TabsTrigger></TabsList><TabsContent value="a">Content
          A</TabsContent></Tabs>'
    accessibility:
      role: tablist
      keyboard: [ ArrowLeft, ArrowRight, Home, End ]
      notes: Full keyboard navigation via Radix

  - name: Tooltip
    tier: ui
    description: Informational popup on hover using Radix Tooltip
    examples:
      - label: Basic tooltip
        code: '<TooltipProvider><Tooltip><TooltipTrigger>Hover</TooltipTrigger><TooltipContent>Info</TooltipContent></Tooltip></TooltipProvider>'
    accessibility:
      role: tooltip
      notes: Accessible via Radix, shown on focus as well as hover

  # ─── Primitives tier ───
  - name: ColorPicker
    tier: primitives
    description: Color selection control with native picker and hex text input
    examples:
      - label: Basic color picker
        code: '<ColorPicker label="Primary" value="#3b82f6" onChange={setValue} />'
    accessibility:
      keyboard: [ Tab, Enter ]
      notes: Uses native color input for accessibility; hex text input for manual
        entry

  - name: ConfirmDialog
    tier: primitives
    description: Confirmation modal wrapping Dialog with confirm and cancel actions
    examples:
      - label: Delete confirmation
        code: '<ConfirmDialog open={open} onOpenChange={setOpen} title="Delete?"
          description="This action cannot be undone." variant="destructive"
          onConfirm={handleDelete} />'
    accessibility:
      role: alertdialog
      keyboard: [ Escape, Tab, Enter ]
      notes: Traps focus; destructive variant draws attention to confirm button

  - name: FontPicker
    tier: primitives
    description: Font selection dropdown with preset fonts and custom font entry
    examples:
      - label: Basic font picker
        code: '<FontPicker label="Heading" value="Inter" onChange={setFont} />'
    accessibility:
      keyboard: [ ArrowUp, ArrowDown, Enter, Escape ]
      notes: Built on Select primitive; supports custom font input mode

  - name: IconButton
    tier: primitives
    description: Button variant displaying only an icon with an accessible label
    examples:
      - label: Settings icon button
        code: '<IconButton icon={Settings} label="Settings" />'
    accessibility:
      role: button
      keyboard: [ Enter, Space ]
      notes: Uses aria-label for screen readers; icon is decorative

  - name: TagInput
    tier: primitives
    description: Multi-value tag entry with keyboard support for add and remove
    examples:
      - label: Basic tag input
        code: '<TagInput tags={tags} onChange={setTags} placeholder="Add tag..." />'
    accessibility:
      keyboard: [ Enter, Backspace ]
      notes: Enter adds tag; Backspace removes last tag when input is empty

  # ─── Features tier ───
  - name: AssetCard
    tier: features
    description: Card displaying an asset preview with name, size, and MIME type badge
    examples:
      - label: SVG asset
        code: '<AssetCard name="logo.svg" url="/assets/logo.svg" size={1024}
          mimeType="image/svg+xml" />'
    accessibility:
      notes: Clickable card; image assets display preview, non-image assets show file
        icon

  - name: BrandCard
    tier: features
    description: Card displaying a brand identity with color swatch and description
    examples:
      - label: Brand card
        code: '<BrandCard name="Acme" slug="acme" description="Corporate identity"
          primaryColor="#3b82f6" />'
    accessibility:
      notes: Clickable card with color swatch indicator

  - name: Breadcrumbs
    tier: features
    description: Navigation breadcrumb trail with linked segments
    examples:
      - label: Basic breadcrumbs
        code: '<Breadcrumbs items={[{ label: "Home", href: "/" }, { label: "Templates"
          }]} />'
    accessibility:
      role: navigation
      keyboard: [ Tab ]
      notes: Uses nav element; last item is non-interactive current page indicator

  - name: LivePreview
    tier: features
    description: Iframe-based live preview panel with refresh control
    examples:
      - label: Template preview
        code: '<LivePreview url="/preview/template-1" />'
    accessibility:
      notes: Iframe has descriptive title attribute; refresh button is keyboard
        accessible

  - name: MonacoEditor
    tier: features
    description: Monaco code editor wrapper with dark theme and sensible defaults
    examples:
      - label: TypeScript editor
        code: '<MonacoEditor value={code} onChange={setCode} language="typescript" />'
    accessibility:
      notes: Monaco provides built-in keyboard navigation and screen reader support

  - name: Nav
    tier: features
    description: Top navigation bar with route links and command palette trigger
    examples:
      - label: Navigation bar
        code: '<Nav />'
    accessibility:
      role: navigation
      keyboard: [ Tab, Cmd+K ]
      notes: Cmd+K opens search command palette; active route is visually highlighted

  - name: SearchCommand
    tier: features
    description: Command palette for searching templates and brands with Cmd+K shortcut
    examples:
      - label: Search command
        code: '<SearchCommand open={open} onOpenChange={setOpen} />'
    accessibility:
      role: combobox
      keyboard: [ Cmd+K, ArrowUp, ArrowDown, Enter, Escape ]
      notes: Full keyboard navigation; results grouped by type

  - name: Sidebar
    tier: features
    description: Collapsible sidebar navigation with sections, search, and category counts
    examples:
      - label: Sidebar navigation
        code: '<Sidebar />'
    accessibility:
      role: navigation
      keyboard: [ Tab, Enter, Space ]
      notes: Collapsible sections; search filters visible items

  - name: TemplateCard
    tier: features
    description: Card displaying a template with name, description, category badge, and tags
    examples:
      - label: Template card
        code: '<TemplateCard name="Hero Section" category="landing" tags={["hero",
          "cta"]} />'
    accessibility:
      notes: Clickable card with badge indicators for category and tags

  - name: ColorSwatch
    tier: features
    description: Individual brand color specimen with hex, RGB, and role metadata
    examples:
      - label: Primary swatch
        code: '<ColorSwatch name="Brand Primary" hex="#0057B8" rgb={[0, 87, 184]} />'
    accessibility:
      notes: Colour name and hex are exposed as text so value is not conveyed by colour alone

  - name: ComponentSpecViewer
    tier: features
    description: Combined spec viewer (props, variants, examples, playground) for a single component
    examples:
      - label: View Button spec
        code: '<ComponentSpecViewer componentName="Button" />'
    accessibility:
      notes: Uses semantic headings and tab landmarks for sections

  - name: Playground
    tier: features
    description: Client-side JSX sandbox that transpiles user code with Babel standalone and renders a live preview
    examples:
      - label: Button playground
        code: '<Playground componentName="Button" initialCode="<Button>Click</Button>" />'
    accessibility:
      notes: Code editor is keyboard-accessible; errors are surfaced in a labelled live region

  - name: VariantsGallery
    tier: features
    description: Grid of rendered variant combinations for a component, driven by the registry spec
    examples:
      - label: Button variants
        code: '<VariantsGallery componentName="Button" variants={spec.variants} />'
    accessibility:
      notes: Each variant is labelled with its prop combination for screen readers

  - name: LogoLockupCard
    tier: features
    description: Preview card for a brand logo variant with label, usage note, and download action
    examples:
      - label: Horizontal lockup
        code: '<LogoLockupCard url="/brand-assets/acme/horizontal.svg" label="Horizontal" usage="Primary lockup" preferred downloadName="acme-horizontal.svg" />'
    accessibility:
      notes: Download link carries descriptive aria-label; preferred state has visible and text cue

  - name: PortalBreadcrumbs
    tier: features
    description: Breadcrumb trail for brand portal pages with the current page as the final non-link item
    examples:
      - label: Portal breadcrumb
        code: '<PortalBreadcrumbs items={[{ label: "Acme", href: "/portal/acme" }, { label: "Colors" }]} />'
    accessibility:
      role: navigation
      notes: Uses nav + aria-label="Breadcrumb" with aria-current on the active crumb

  - name: PortalSidebar
    tier: features
    description: Collapsible sidebar for brand portal layouts with section groups and active-route highlighting
    examples:
      - label: Brand portal sidebar
        code: '<PortalSidebar slug="acme" brandName="Acme Corp" brandInitial="A" brandInitialColor="#0057B8" />'
    accessibility:
      role: navigation
      keyboard: [ Tab, Enter, Space ]
      notes: Active link is marked with aria-current="page"

  - name: PortalTopNav
    tier: features
    description: Top-level navigation bar for brand portal pages with Design Library section links and active-state indicator
    examples:
      - label: Brands section active
        code: '<PortalTopNav activeSection="brands" />'
    accessibility:
      role: banner
      keyboard: [ Tab, Enter ]
      notes: Uses aria-current="page" on the active link; nav is labelled "Design Library sections"

  - name: SanitisedHtml
    tier: features
    description: Server component that renders pre-sanitised HTML (already run through sanitize-html)
    examples:
      - label: Guidelines section body
        code: '<SanitisedHtml html={section.html} className="prose" />'
    accessibility:
      notes: Relies on upstream sanitisation; never accepts raw user HTML at render time

  - name: TypeSpecimen
    tier: features
    description: Typography specimen row showing family, weight, size, line-height, and a sample string
    examples:
      - label: Heading specimen
        code: '<TypeSpecimen label="H1" sample="The quick brown fox" family="Inter" size="2.25rem" lineHeight="1.2" weight={700} />'
    accessibility:
      notes: Label and metadata are exposed as text so styling is not conveyed by appearance alone
