[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:nextjs]
command=node .next/standalone/server.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="8095",HOSTNAME="0.0.0.0"

[program:api]
command=npx tsx src/api/server.ts
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",API_PORT="8096",TEMPLATES_DIR="/app/templates",BRANDS_DIR="/app/brands",ASSETS_DIR="/app/assets",SRC_DIR="/app/src",CORS_ORIGIN="%(ENV_CORS_ORIGIN)s"
